<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("calculator-theme");
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <img
            class="logo"
            src="{{ url_for('static', filename='football.svg') }}"
            alt=""
            width="40"
            height="40"
          />
          <div>
            <p class="eyebrow">Python · Flask</p>
            <h1>Calculator</h1>
          </div>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
          Dark theme
        </button>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="display" id="display" role="status" aria-live="polite">0</div>
        <div class="keys">
          <button type="button" class="fn" data-action="clear">AC</button>
          <button type="button" class="fn" data-action="sign">±</button>
          <button type="button" class="fn" data-action="percent">%</button>
          <button type="button" class="op" data-op="/">÷</button>

          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" class="op" data-op="*">×</button>

          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" class="op" data-op="-">−</button>

          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" class="op" data-op="+">+</button>

          <button type="button" class="span-2" data-digit="0">0</button>
          <button type="button" data-digit=".">.</button>
          <button type="button" class="eq" data-action="equals">=</button>
        </div>
        <p class="hint" id="hint">Results are calculated on the server.</p>
      </section>
    </main>
    <script src="{{ url_for('static', filename='calculator.js') }}"></script>
  </body>
</html>
